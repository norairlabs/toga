# Workflow to Build & Deploy Toga
name: Build TOGA & Deploy Installer to CDN

# Triggers
on:
   # Push a tag to run this workflow, ex: v0.0.1
  push:
    tags:
      - "v*.*.*"
  
  # Allows you to run this workflow manually from the Actions Tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  # Build Stage
  build:

    # Build only for release configuration
    strategy:
      fail-fast: true
      matrix:   
        configuration: [Release]

    # Build On Windows
    runs-on: windows-latest                                                       

    # Set ENV Options                                                                             
    env:
    
      # Set Solution Name
      Solution_Name: TOGA.sln

      # Set Project Path
      Project_Path: TOGA\TOGA.csproj

      # Set Release Path
      Workspace_Release_Build_Path: ${{ github.workspace }}\release\*

      # Set Release Path - ZIP
      Workspace_Release_Build_Zip_Path: ${{ github.workspace }}\TOGA-${{ github.ref_name }}-portable.zip

      # Set Installer Project Path
      Workspace_Installer_Path: ${{ github.workspace }}\TOGASetup\TOGASetup.vdproj

      # Set Release Path - Installer
      Workspace_Installer_Setup_Build_Path: ${{ github.workspace }}\TOGASetup\Setup\*

      # Set Release Path - Installer - ZIP
      Workspace_Installer_Setup_Build_Zip_Path: ${{ github.workspace }}\TOGA-${{ github.ref_name }}-installer.zip
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup GH Pages
      id: pages
      uses: actions/configure-pages@v5

    # ENV - Setup
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Project Stages
    - name: Project - Setup
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}
    - name: Project - Build
      run: dotnet publish $env:Project_Path -c Release -o release
    - name: Project - ZIP
      run: Compress-Archive -Path $env:Workspace_Release_Build_Path -Destination $env:Workspace_Release_Build_Zip_Path
          
    # Installer Stages
    - name: Installer - Setup
      uses: seanmiddleditch/gha-setup-vsdevenv@v4
    - name: Installer - Build
      run: devenv.com $env:Workspace_Installer_Path /Build "Setup"
    - name: Installer - ZIP
      run: Compress-Archive -Path $env:Workspace_Installer_Setup_Build_Path -Destination $env:Workspace_Installer_Setup_Build_Zip_Path

    # Upload Artifacts
    - name: Release artifacts
      uses: softprops/action-gh-release@v2.2.2
      with:
          files: |
              ${{$env:Workspace_Release_Build_Zip_Path}}
              ${{$env:Workspace_Installer_Setup_Build_Zip_Path}}
          token: ${{ secrets.GITHUB_TOKEN }}

    # Run Commands
    - name: CDN - Setup
      shell: pwsh
      run: |
         mkdir cdn_output && cd cdn_output
         Copy-Item $env:Workspace_Installer_Setup_Build_Zip_Path -Destination ./TOGA-latest.zip       
          
    # CDN - Setup
    - name: CDN - Upload
      id: deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: cdn_output/
          
  # Deployment Stage
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
